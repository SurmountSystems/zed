# Surmount-maintained, not from xtask workflows.
# Optional CI: build release zed (agent-stdio default) → cargo xtask dogfood preflight.
# Nightly / workflow_dispatch only — not on the PR critical path (full release build is ~15+ min).
# `cargo xtask workflows` only rewrites files that start with "# Generated from xtask::workflows::";
# this file is intentionally hand-written so Surmount can use ubuntu-latest without the
# zed-industries repository_owner_guard / Namespace runners.
#
# Local equivalent (matches CI: ZED_BIN env; optional --bin is equivalent):
#   cargo build --release -p zed
#   ZED_BIN=target/release/zed cargo xtask dogfood preflight --timeout-secs 90
#   ZED_BIN=target/release/zed cargo xtask dogfood golden --timeout-secs 90
name: dogfood_preflight

on:
  schedule:
    # Nightly UTC — release build + preflight + golden
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      run_golden:
        description: "Also run cargo xtask dogfood golden after preflight (Linux snapshot path)"
        type: boolean
        default: true
      run_merge_review:
        description: "Also run cargo xtask dogfood merge-review (long timeout; Surmount workspace fixture; opt-in only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dogfood-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  # Match upstream Linux CI (steps::use_clang) — script/linux installs clang.
  CC: clang
  CXX: clang++
  # agent-stdio is a default feature on Surmount's zed crate; release bin is the gate binary
  ZED_BIN: ${{ github.workspace }}/target/release/zed

jobs:
  preflight:
    name: linux-release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -euxo pipefail {0}
    steps:
      - name: Free disk headroom
        # Full release -p zed + rust-cache can fill default GHA free disk. Log df and drop
        # common large preinstalls unused by this gate. Larger runners remain preferred if reds persist.
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Linux deps (script/linux)
        run: ./script/linux

      - name: Rust cache
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: dogfood-preflight-linux
          cache-on-failure: true

      - name: Build release zed (agent-stdio default)
        # Full release is intentional: preflight exercises the headless agent-stdio path.
        # Scoped to -p zed (not whole workspace) to bound time. Not a PR check — see header.
        run: cargo build --release -p zed

      - name: Dogfood preflight
        # Rust gate only — no shell dogfood drivers. Fails the job on non-zero exit.
        # ZED_BIN from env (clap env = "ZED_BIN"); longer timeout for cold shared runners.
        run: cargo xtask dogfood preflight --timeout-secs 90

      - name: Dogfood golden (nightly / dispatch)
        # Snapshot dogfood is Linux-primary (W5). macOS/Windows unsupported for non-empty snapshot.
        # Optional: may be flaky under CI load; kept off PR critical path.
        if: ${{ github.event_name == 'schedule' || inputs.run_golden }}
        run: cargo xtask dogfood golden --timeout-secs 90 --fixture "$GITHUB_WORKSPACE/README.md"

      - name: Dogfood merge-review (dispatch opt-in only)
        # Default adventure Start→Preview→End; long timeout; room detail; Surmount checkout as fixture.
        # Never on schedule by default (flaky risk) and never on pull_request.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_merge_review }}
        run: >
          cargo xtask dogfood merge-review
          --fixture "$GITHUB_WORKSPACE"
          --snapshot-detail room
          --timeout-secs 180
