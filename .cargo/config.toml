#   agent-client-protocol 1.0.1  (crates.io 2026-06-29) → menhera earliest 2026-07-09
# Workspace pins until human verifies exact versions on menhera:
#   wgpu = "29.0.3"
#   agent-client-protocol = "=1.0.0"
# As of 2026-07-08: still BEFORE binding date — do not unpin.
# On/after 2026-07-12: calendar alone is insufficient — human must still run both
# cargo info checks and only then bump Cargo.toml + drop this comment block:
